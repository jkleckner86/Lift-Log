<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0d0d0d">
<title>Lift Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" fill="none" aria-label="Lift Log logo" role="img">
      <rect x="2" y="10" width="4" height="12" fill="currentColor"/>
      <rect x="7" y="7" width="4" height="18" fill="currentColor"/>
      <rect x="11" y="14.5" width="10" height="3" fill="currentColor"/>
      <rect x="21" y="7" width="4" height="18" fill="currentColor"/>
      <rect x="26" y="10" width="4" height="12" fill="currentColor"/>
    </svg>
    <span id="screenTitle">Calendar</span>
  </div>
  <button class="today-btn" id="todayBtn" type="button">Today</button>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" aria-label="Main">
  <button data-tab="calendar" class="tab active" type="button">
    <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 2v5M16 2v5" stroke="currentColor" stroke-width="2"/></svg>
    <span>Calendar</span>
  </button>
  <button data-tab="plan" class="tab" type="button">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2"/></svg>
    <span>Plan</span>
  </button>
  <button data-tab="progress" class="tab" type="button">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 20h18" stroke="currentColor" stroke-width="2"/><path d="M4 16l5-5 4 3 7-8" stroke="currentColor" stroke-width="2"/></svg>
    <span>Progress</span>
  </button>
  <button data-tab="body" class="tab" type="button">
    <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" stroke="currentColor" stroke-width="2"/><path d="M8 9h8l-2 4h-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/></svg>
    <span>Body</span>
  </button>
  <button data-tab="more" class="tab" type="button">
    <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="11" width="3" height="3" fill="currentColor"/><rect x="10.5" y="11" width="3" height="3" fill="currentColor"/><rect x="17" y="11" width="3" height="3" fill="currentColor"/></svg>
    <span>More</span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="workout" class="workout" hidden></div>
<div id="restbar" class="restbar" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/chart.umd.min.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
